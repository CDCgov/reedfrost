- set_page_config:
    page_title: "{page_title}"
    page_icon: "{page_icon}"
    layout: wide
- title: "{page_title}"
- sidebar:
  - slider:
      key: n
      label: "{n_label}"
      min_value: 1
      max_value: 100
      step: 1
  - select_slider:
      key: n_immune
      label: "{prop_immune_label}"
      code_options: "list(range(0, app.get_data('n')))"
      code_format_func: "lambda x, app=app: f\"{x / app.get_data('n'):.0%}\""
  - slider:
      key: brn
      label: "{brn_label}"
      min_value: 0.0
      code_max_value: "min(15.0, float(app.get_data('n')))"
      step: 0.1
      format: "%.1f"
  - segmented_control:
      key: model
      label: "{model_label}"
      options: ["Reed-Frost", "Enko", "Greenwood"]
  - segmented_control:
      key: result_type
      label: "{result_type_label}"
      options: ["Trajectories", "Theoretical"]
  - segmented_control:
      key: metric
      label: "{metric_label}"
      options: ["Cumulative", "Incident"]
  - header: "{input_header}"
  - expander:
      label: "{expander_title}"
      expanded: false
      children:
        - empty:
            - if:
                condition: "app.get_data('n') - app.get_data('n_immune') == 1"
                then:
                - text: "{n_infected_label}: 1"
                else:
                - slider:
                    key: n_infected
                    label: "{n_infected_label}"
                    min_value: 1
                    code_max_value: "app.get_data('n') - app.get_data('n_immune')"
                    step: 1
        - slider:
            key: n_simulations
            label: "{n_simulations_label}"
            min_value: 5
            max_value: 250
            step: 1
        - number_input:
            key: seed
            label: "{seed_label}"
            min_value: 0
            code_max_value: 2**32 - 1
            step: 1
  - divider
  - header: "{links_header}"
  - page_link:
      page: "{gh_page}"
      label: "{gh_label}"
      icon: "{gh_icon}"
  - page_link:
      page: "{doc_page}"
      label: "{doc_label}"
      icon: "{doc_icon}"
- columns:
      spec: [1, 1, 1, 3]
      children:
        - column:
            - metric:
                label: "{susceptible_label}"
                code_value: "app.get_data('n_susceptible')"
        - column:
            - metric:
                label: "{immune_label}"
                code_value: "app.get_data('n_immune')"
        - column:
            - metric:
                label: "{infected_label}"
                code_value: "app.get_data('n_infected')"
- empty:
    - if:
        condition: "not app.get_data('results')"
        then:
          - text: "{no_results_label}"
        else:
            - if:
                condition: "app.get_data('result_type') == 'Trajectories'"
                then:
                    - trajectories_chart
                else:
                    - theoretical_chart
