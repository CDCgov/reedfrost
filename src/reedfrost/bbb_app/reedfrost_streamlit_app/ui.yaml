- set_page_config:
    page_title: "{page_title}"
    page_icon: "{page_icon}"
    layout: wide
- title: "{page_title}"
- sidebar:
  - slider:
      key: n
      label: "{n_label}"
      min_value: 1
      max_value: 100
      step: 1
  - select_slider:
      key: n_immune
      label: "{prop_immune_label}"
      options: _code
      format_func: _code
  - slider:
      key: brn
      label: "{brn_label}"
      min_value: 0.0
      max_value: _code
      step: 0.1
      format: "%.1f"
  - segmented_control:
      key: model
      label: "{model_label}"
      options: ["Reed-Frost", "Enko", "Greenwood"]
  - segmented_control:
      key: result_type
      label: "{result_type_label}"
      options: ["Trajectories", "Theoretical"]
  - segmented_control:
      key: metric
      label: "{metric_label}"
      options: ["Cumulative", "Incident"]
  - header: "{input_header}"
  - expander:
      label: "{expander_title}"
      expanded: false
      children:
        - empty:
            - if:
                condition: _code_one_susceptible
                then:
                - text: "{n_infected_label}: 1"
                else:
                - slider:
                    key: n_infected
                    label: "{n_infected_label}"
                    min_value: 1
                    max_value: _code
                    step: 1
        - slider:
            key: n_simulations
            label: "{n_simulations_label}"
            min_value: 5
            max_value: 250
            step: 1
        - number_input:
            key: seed
            label: "{seed_label}"
            min_value: 0
            max_value: _code
            step: 1
  - divider
  - header: "{links_header}"
  - page_link:
      page: "{gh_page}"
      label: "{gh_label}"
      icon: "{gh_icon}"
  - page_link:
      page: "{doc_page}"
      label: "{doc_label}"
      icon: "{doc_icon}"
- columns:
      spec: [1, 1, 1, 3]
      children:
        - column:
            - metric:
                label: "{susceptible_label}"
                value: _code_get_n_susceptible
        - column:
            - metric:
                label: "{immune_label}"
                value: _code_get_n_immune
        - column:
            - metric:
                label: "{infected_label}"
                value: _code_get_n_infected
- empty:
    - if:
        condition: _code_results_not_available
        then:
          - text: "{no_results_label}"
        else:
            - if:
                condition: _code_results_are_trajectories
                then:
                    - trajectories_chart
                else:
                    - theoretical_chart
